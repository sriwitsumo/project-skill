<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Install project-skill in three steps</title>
  <desc id="desc">Clone the repository, copy a skill into Claude Code's skills directory, then try a Thai prompt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#020617" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <rect x="48" y="42" width="1104" height="7" rx="3.5" fill="url(#accent)"/>
  <text x="60" y="100" fill="#f8fafc" font-family="Arial, Tahoma, sans-serif" font-size="34" font-weight="700">ติดตั้ง project-skill ใน 3 ขั้นตอน</text>
  <text x="60" y="134" fill="#cbd5e1" font-family="Arial, Tahoma, sans-serif" font-size="19">สำหรับ Claude Code · ใช้เวลาประมาณ 2 นาที</text>
  <g filter="url(#shadow)">
    <rect x="60" y="180" width="336" height="350" rx="20" fill="#172554" stroke="#334155"/>
    <rect x="432" y="180" width="336" height="350" rx="20" fill="#172554" stroke="#334155"/>
    <rect x="804" y="180" width="336" height="350" rx="20" fill="#172554" stroke="#334155"/>
  </g>
  <g font-family="Arial, Tahoma, sans-serif">
    <circle cx="102" cy="224" r="22" fill="#22d3ee"/><text x="102" y="231" text-anchor="middle" fill="#082f49" font-size="22" font-weight="700">1</text>
    <text x="138" y="231" fill="#f8fafc" font-size="23" font-weight="700">Clone รีโป</text>
    <rect x="84" y="266" width="288" height="112" rx="12" fill="#020617"/>
    <text x="103" y="308" fill="#67e8f9" font-family="Menlo, Monaco, monospace" font-size="15">git clone</text>
    <text x="103" y="336" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="13">github.com/sriwitsumo/</text>
    <text x="103" y="360" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="13">project-skill.git</text>
    <text x="84" y="435" fill="#cbd5e1" font-size="17">ดาวน์โหลดสกิลลงเครื่อง</text>

    <circle cx="474" cy="224" r="22" fill="#818cf8"/><text x="474" y="231" text-anchor="middle" fill="#312e81" font-size="22" font-weight="700">2</text>
    <text x="510" y="231" fill="#f8fafc" font-size="23" font-weight="700">ติดตั้ง 1 สกิล</text>
    <rect x="456" y="266" width="288" height="112" rx="12" fill="#020617"/>
    <text x="475" y="308" fill="#a5b4fc" font-family="Menlo, Monaco, monospace" font-size="13">mkdir -p ~/.claude/skills</text>
    <text x="475" y="337" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="11">cp -R thai-project-chapter1</text>
    <text x="475" y="360" fill="#e2e8f0" font-family="Menlo, Monaco, monospace" font-size="11">~/.claude/skills/</text>
    <text x="456" y="435" fill="#cbd5e1" font-size="17">เลือกสกิลที่ต้องการใช้</text>

    <circle cx="846" cy="224" r="22" fill="#fbbf24"/><text x="846" y="231" text-anchor="middle" fill="#451a03" font-size="22" font-weight="700">3</text>
    <text x="882" y="231" fill="#f8fafc" font-size="23" font-weight="700">เริ่มใช้งาน</text>
    <rect x="828" y="266" width="288" height="112" rx="12" fill="#020617"/>
    <text x="847" y="307" fill="#fef3c7" font-family="Arial, Tahoma, sans-serif" font-size="15">เปิด Claude Code แล้วพิมพ์</text>
    <text x="847" y="342" fill="#e2e8f0" font-family="Arial, Tahoma, sans-serif" font-size="14">“ช่วยเขียนบทที่ 1</text>
    <text x="847" y="366" fill="#e2e8f0" font-family="Arial, Tahoma, sans-serif" font-size="14">โครงงานให้หน่อย”</text>
    <text x="828" y="435" fill="#cbd5e1" font-size="17">สกิลจะทำงานอัตโนมัติ</text>
  </g>
  <text x="60" y="580" fill="#94a3b8" font-family="Arial, Tahoma, sans-serif" font-size="16">ดูคู่มือติดตั้งแบบละเอียดและรายชื่อสกิลทั้งหมดด้านล่าง</text>
</svg>
